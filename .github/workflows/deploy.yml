# Builds the app and publishes it to GitHub Pages on every push to main.
# SETUP: repo Settings → Pages → Source = "GitHub Actions"; Settings → Secrets and variables → Actions → Variables → API_URL.
name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check API_URL variable is set
        run: test -n "$API_URL" || { echo "Set the API_URL repository variable (Settings > Secrets and variables > Actions > Variables)"; exit 1; }
        env: { API_URL: "${{ vars.API_URL }}" }
      - run: npm install
      - run: npm run build
        env: { VITE_API_URL: "${{ vars.API_URL }}" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
